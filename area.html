<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごみ分別カードゲーム ルールブック</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #FFF9EE;
  --card: #FFFFFF;
  --ink: #33404A;
  --ink-soft: #6B7680;
  --green: #3FA65C;
  --green-dark: #2F8B49;
  --green-bg: #E5F6E9;
  --yellow: #F5B93D;
  --yellow-bg: #FFF4DC;
  --red: #EF5B4E;
  --red-bg: #FDE6E3;
  --blue: #3E92CC;
  --blue-bg: #E4F1FA;
  --shadow: 0 6px 0 rgba(51,64,74,0.08),
            0 10px 24px rgba(51,64,74,0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  padding-bottom: 80px;
  background:
    radial-gradient(circle at 8% 12%, var(--green-bg) 0%, transparent 40%),
    radial-gradient(circle at 92% 18%, var(--red-bg) 0%, transparent 38%),
    radial-gradient(circle at 50% 90%, var(--yellow-bg) 0%, transparent 45%),
    var(--cream);
  color: var(--ink);
  font-family: 'BIZ UDPGothic', 'Hiragino Maru Gothic ProN',
               'Yu Gothic', sans-serif;
  font-size: 18px;
  line-height: 1.9;
}

.hidden {
  display: none !important;
}

ruby rt {
  font-size: 0.55em;
  color: var(--ink-soft);
  font-weight: 400;
  letter-spacing: 0;
}

/* 戻るボタン */
.fixed-btn-left {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1000;
}

/* タイトル部分 */
.hero {
  text-align: center;
  padding: 100px 20px 40px;
  position: relative;
}

.hero-cards {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 18px;
}

.mini-card {
  width: 52px;
  height: 70px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  box-shadow: var(--shadow);
  transform: rotate(var(--r, 0deg));
  background: var(--card);
  border: 3px solid var(--c, var(--ink));
}

.mini-card:nth-child(1) {
  --r: -10deg;
  --c: var(--green);
}

.mini-card:nth-child(2) {
  --r: 4deg;
  --c: var(--yellow);
  margin-top: -8px;
}

.mini-card:nth-child(3) {
  --r: 12deg;
  --c: var(--red);
}

h1 {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 900;
  font-size: clamp(30px, 7vw, 44px);
  margin: 0 0 8px;
  color: var(--ink);
  letter-spacing: 0.02em;
}

/* 戻るボタン */
.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 6px 14px;
  background: #fff;
  color: var(--ink);
  border: 3px solid var(--green);
  border-radius: 14px;
  box-shadow: var(--shadow);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
}

.back-btn:hover {
  transform: translateY(-2px);
}

.back-btn:active {
  transform: translateY(2px);
}

/* 地域選択欄 */
#city,
#ward {
  width: min(280px, 90vw);
  height: 60px;
  margin-top: 30px;
  padding: 8px 14px;
  border: 3px solid var(--blue);
  border-radius: 14px;
  background: #fff;
  color: var(--ink);
  box-shadow: var(--shadow);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

/* 検索ボタンの配置 */
.next-area {
  display: flex;
  justify-content: center;
  margin: 40px auto 30px;
  padding: 0 20px;
}

/* 緑色の「つぎへ」ボタンと同じデザイン */
.next-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 280px;
  min-height: 76px;
  padding: 16px 28px;
  background: var(--green);
  color: #fff;
  border: 4px solid var(--green-dark);
  border-radius: 22px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 26px;
  font-weight: 900;
  box-shadow: 0 7px 0 var(--green-dark);
  cursor: pointer;
  transition: 0.2s;
}

.next-btn:hover {
  transform: translateY(3px);
  box-shadow: 0 4px 0 var(--green-dark);
}

.next-btn:active {
  transform: translateY(6px);
  box-shadow: 0 1px 0 var(--green-dark);
}

.next-btn:focus-visible,
.back-btn:focus-visible,
#city:focus-visible,
#ward:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 4px;
}

/* 選択した住所 */
#result {
  margin: 24px auto 0;
  padding: 0 12px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* スマートフォン対応 */
@media (max-width: 600px) {
  body {
    font-size: 16px;
  }

  .hero {
    padding: 100px 14px 30px;
  }

  .fixed-btn-left {
    top: 10px;
    left: 10px;
  }

  .back-btn {
    min-height: 44px;
    padding: 6px 10px;
  }

  #city,
  #ward {
    height: 54px;
    margin-top: 22px;
    font-size: 16px;
  }

  .next-area {
    margin-top: 30px;
    padding: 0 16px;
  }

  .next-btn {
    width: 100%;
    max-width: 320px;
    min-height: 68px;
    font-size: 23px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- 戻るボタン -->
<div class="fixed-btn-left">
  <a href="rule.html" class="back-btn">◀ もどる</a>
</div>

<!-- タイトルと地域選択 -->
<div class="hero">

  <div class="hero-cards">
    <div class="mini-card">🥫</div>
    <div class="mini-card">📄</div>
    <div class="mini-card">♻️</div>
  </div>

  <h1>Wakete</h1>

  <!-- 市町村選択 -->
  <div>
    <select id="city" aria-label="市町村を選択">
      <option value="">地域を選択</option>
    </select>
  </div>

  <!-- 区選択：最初は非表示 -->
  <div>
    <select id="ward" class="hidden" aria-label="区を選択">
      <option value="">区を選択</option>
    </select>
  </div>

  <!-- 検索ボタン：最初は非表示 -->
  <div class="next-area hidden" id="searchArea">
    <button id="searchBtn" type="button" class="next-btn">
      検索 ▶
    </button>
  </div>

  <!-- 選択した住所 -->
  <p id="result" aria-live="polite"></p>

</div>

<script>
/* =========================
   市町村と区の一覧
========================= */

const osaka = {
  "伊丹市": [],
  "池田市": [],
  "泉大津市": [],
  "泉佐野市": [],
  "和泉市": [],
  "茨木市": [],
  "大阪狭山市": [],

  "大阪市": [
    "北区", "都島区", "福島区", "此花区", "中央区",
    "西区", "港区", "大正区", "天王寺区", "浪速区",
    "西淀川区", "淀川区", "東淀川区", "東成区", "生野区",
    "旭区", "城東区", "鶴見区", "阿倍野区", "住之江区",
    "住吉区", "東住吉区", "平野区", "西成区"
  ],

  "貝塚市": [],
  "柏原市": [],
  "交野市": [],
  "門真市": [],
  "河内長野市": [],
  "岸和田市": [],

  "堺市": [
    "堺区", "中区", "東区", "西区",
    "南区", "北区", "美原区"
  ],

  "吹田市": [],
  "摂津市": [],
  "高石市": [],
  "高槻市": [],
  "大東市": [],
  "豊中市": [],
  "富田林市": [],
  "寝屋川市": [],
  "羽曳野市": [],
  "阪南市": [],
  "東大阪市": [],
  "枚方市": [],
  "藤井寺市": [],
  "松原市": [],
  "箕面市": [],
  "守口市": [],
  "八尾市": []
};

/* =========================
   HTML要素の取得
========================= */

const citySelect = document.getElementById("city");
const wardSelect = document.getElementById("ward");
const searchArea = document.getElementById("searchArea");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");

/* =========================
   市町村の選択肢を作成
========================= */

Object.keys(osaka).forEach(city => {
  const option = document.createElement("option");
  option.value = city;
  option.textContent = city;
  citySelect.appendChild(option);
});

/* =========================
   市町村が変更されたとき
========================= */

citySelect.addEventListener("change", function() {
  const city = this.value;
  const wards = osaka[city];

  // 区の選択肢を初期化
  wardSelect.innerHTML = '<option value="">区を選択</option>';

  // 検索ボタンと住所表示を初期化
  searchArea.classList.add("hidden");
  result.textContent = "";

  // 区の選択欄もいったん隠す
  wardSelect.classList.add("hidden");

  // 市町村が未選択なら終了
  if (city === "") {
    return;
  }

  if (wards.length > 0) {
    // 区がある市：区の選択欄を表示
    wardSelect.classList.remove("hidden");

    // 区の選択肢を追加
    wards.forEach(ward => {
      const option = document.createElement("option");
      option.value = ward;
      option.textContent = ward;
      wardSelect.appendChild(option);
    });

    // 区が選ばれるまで検索ボタンは表示しない
  } else {
    // 区がない市：市を選んだ時点で検索ボタンを表示
    result.textContent = "選択住所：" + city;
    searchArea.classList.remove("hidden");
  }
});

/* =========================
   区が変更されたとき
========================= */

wardSelect.addEventListener("change", function() {
  const city = citySelect.value;
  const ward = this.value;

  // 区が選び直されたら、いったん検索ボタンを隠す
  searchArea.classList.add("hidden");
  result.textContent = "";

  // 区が未選択なら終了
  if (ward === "") {
    return;
  }

  // 区が選択されたら住所と検索ボタンを表示
  result.textContent = "選択住所：" + city + " " + ward;
  searchArea.classList.remove("hidden");
});

/* =========================
   地域ごとのページ対応表
========================= */

const pageMap = {
  // 市町村
  "伊丹市": "pages/itami.html",
  "池田市": "pages/ikeda.html",
  "泉大津市": "pages/izumiotsu.html",
  "泉佐野市": "pages/izumisano.html",
  "和泉市": "pages/izumi.html",
  "茨木市": "pages/ibaraki.html",
  "大阪狭山市": "pages/osakasayama.html",
  "貝塚市": "pages/kaiduka.html",
  "柏原市": "pages/kashiwara.html",
  "交野市": "pages/katano.html",
  "門真市": "pages/kadoma.html",
  "河内長野市": "pages/kawachinagano.html",
  "岸和田市": "pages/kishiwada.html",
  "吹田市": "pages/suita.html",
  "摂津市": "pages/settsu.html",
  "高石市": "pages/takaishi.html",
  "高槻市": "pages/takatsuki.html",
  "大東市": "pages/taitou.html",
  "豊中市": "pages/toyonaka.html",
  "富田林市": "pages/tondabayashi.html",
  "寝屋川市": "pages/neyagawa.html",
  "羽曳野市": "pages/habikino.html",
  "阪南市": "pages/hannnann.html",
  "東大阪市": "pages/higashiosaka.html",
  "枚方市": "pages/hirakata.html",
  "藤井寺市": "pages/fujiidera.html",
  "松原市": "pages/matsubara.html",
  "箕面市": "pages/minoo.html",
  "守口市": "pages/moriguchi.html",
  "八尾市": "pages/yao.html",

  // 大阪市
  "大阪市-北区": "pages/osakakitaku.html",
  "大阪市-都島区": "pages/osakatsushima.html",
  "大阪市-福島区": "pages/osakafukushima.html",
  "大阪市-此花区": "pages/osakakonohana.html",
  "大阪市-中央区": "pages/osakachuo.html",
  "大阪市-西区": "pages/osakanishi.html",
  "大阪市-港区": "pages/osakaminato.html",
  "大阪市-大正区": "pages/osakataisho.html",
  "大阪市-天王寺区": "pages/osakatennoji.html",
  "大阪市-浪速区": "pages/osakananiwa.html",
  "大阪市-西淀川区": "pages/osakanishiyodogawa.html",
  "大阪市-淀川区": "pages/osakayodogawa.html",
  "大阪市-東淀川区": "pages/osakahigashiyodogawa.html",
  "大阪市-東成区": "pages/osakahigashinari.html",
  "大阪市-生野区": "pages/osakaikuno.html",
  "大阪市-旭区": "pages/osakaasahi.html",
  "大阪市-城東区": "pages/osakajoto.html",
  "大阪市-鶴見区": "pages/osakatsurumi.html",
  "大阪市-阿倍野区": "pages/osakaabeno.html",
  "大阪市-住之江区": "pages/osakasuminoe.html",
  "大阪市-住吉区": "pages/osakasumiyoshi.html",
  "大阪市-東住吉区": "pages/osakahigashisumiyoshi.html",
  "大阪市-平野区": "pages/osakahirano.html",
  "大阪市-西成区": "pages/osakanishinari.html",

  // 堺市
  "堺市-堺区": "pages/sakaisakai.html",
  "堺市-中区": "pages/sakainaka.html",
  "堺市-東区": "pages/sakaihigashi.html",
  "堺市-西区": "pages/sakainishi.html",
  "堺市-南区": "pages/sakaiminami.html",
  "堺市-北区": "pages/sakaikita.html",
  "堺市-美原区": "pages/sakaimihara.html"
};

/* =========================
   検索ボタンが押されたとき
========================= */

searchBtn.addEventListener("click", function() {
  const city = citySelect.value;

  // 市町村が選択されているか確認
  if (city === "") {
    alert("市町村を選択してください");
    return;
  }

  let key;

  // 区がある市の場合
  if (osaka[city].length > 0) {
    const ward = wardSelect.value;

    // 区が選択されているか確認
    if (ward === "") {
      alert("区を選択してください");
      return;
    }

    key = city + "-" + ward;
  } else {
    // 区がない市の場合
    key = city;
  }

  // 対応するページへ移動
  if (pageMap[key]) {
    window.location.href = pageMap[key];
  } else {
    alert("この地域のページはまだ作成されていません。");
  }
});
</script>

</body>
</html>
