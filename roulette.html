
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>環境影響ルーレット</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --cream:#FFF9E9;
    --card:#FFFFFF;
    --ink:#39475A;
    --green:#42B96B;
    --dark-green:#248B4B;
    --yellow:#FFD84D;
    --orange:#FF9E43;
    --pink:#FF829D;
    --blue:#69C8ED;
    --purple:#AD91ED;
    --shadow:0 6px 0 rgba(51,64,74,0.08), 0 10px 24px rgba(51,64,74,0.08);
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    margin:0;
    background:
        radial-gradient(circle at 8% 12%,#E5F6E9 0%,transparent 40%),
        radial-gradient(circle at 92% 18%,#FDE6E3 0%,transparent 38%),
        radial-gradient(circle at 50% 90%,#FFF4DC 0%,transparent 45%),
        var(--cream);
    color:var(--ink);
    font-family:'BIZ UDPGothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    font-size:18px;
    line-height:1.9;
    padding-bottom:80px;
}

/* 戻るボタン */
.fixed-btn-left {
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
}

.back-btn,
button {
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(14px,2vw,17px);
    font-weight:700;
    min-width:90px;
    height:50px;
    padding:6px 14px;
    background:#fff;
    color:var(--ink);
    border:3px solid var(--green);
    border-radius:14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:0.2s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.back-btn:active,
button:active {
    transform:translateY(2px);
}

/* タイトル */
.hero {
    text-align:center;
    padding:56px 20px 20px;
    position:relative;
}

.hero-cards {
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:18px;
}

.mini-card {
    width:58px;
    height:76px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:var(--shadow);
    transform:rotate(var(--r,0deg));
    background:var(--card);
    border:3px solid var(--c,var(--ink));
}

.mini-card:nth-child(1) {
    --r:-10deg;
    --c:var(--green);
}

.mini-card:nth-child(2) {
    --r:4deg;
    --c:var(--yellow);
    margin-top:-8px;
}

.mini-card:nth-child(3) {
    --r:12deg;
    --c:var(--pink);
}

h1 {
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:900;
    font-size:clamp(30px,7vw,44px);
    margin:0 0 8px;
    color:var(--ink);
    letter-spacing:0.02em;
}

/* マスコット */
.mascot-area {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:15px auto 25px;
}

/* 地球がふわふわ動く */
.mascot {
    font-size:48px;
    display:inline-block;
    animation:earthFloat 2.5s ease-in-out infinite;
    transform-origin:center;
}

@keyframes earthFloat {
    0% {
        transform:translateY(0) rotate(-5deg);
    }

    50% {
        transform:translateY(-12px) rotate(5deg);
    }

    100% {
        transform:translateY(0) rotate(-5deg);
    }
}

.mascot-message {
    background:white;
    border:3px solid var(--yellow);
    border-radius:18px;
    padding:10px 18px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:700;
    box-shadow:var(--shadow);
}

/* メイン */
.main-container {
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:flex-start;
    gap:30px;
    width:100%;
    max-width:1000px;
    margin:20px auto;
    padding:0 12px;
}

.roulette-area {
    flex:0 1 400px;
    min-width:0;
    background:white;
    border:4px solid var(--green);
    border-radius:24px;
    padding:20px;
    box-shadow:var(--shadow);
}

.question-area {
    flex:0 0 300px;
    margin:0;
    text-align:left;
    background:white;
    border:4px solid var(--yellow);
    border-radius:24px;
    padding:20px;
    box-shadow:var(--shadow);
}

/* ルーレット */
.roulette-container {
    position:relative;
    width:100%;
    max-width:400px;
    aspect-ratio:1/1;
    margin:auto;
}

.roulette-container .arrow {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-100%);
    z-index:10;
    width:45px;
    height:90px;
    pointer-events:none;
}

.roulette-container .arrow::before {
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:24px solid transparent;
    border-right:24px solid transparent;
    border-bottom:84px solid #f8f690;
}

.roulette-container .arrow::after {
    content:"";
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-bottom:66px solid #222222;
}

.needle-circle {
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    background:#222222;
    border:3px solid #f8f690;
    display:flex;
    align-items:center;
    justify-content:center;
}

.needle-center {
    width:25px;
    height:25px;
    border-radius:50%;
    background:#f8f690;
    border:3px solid #f8f690;
}

#roulette {
    display:block;
    width:100%;
    height:auto;
}

#spinButton {
    display:block;
    margin:16px auto;
    width:80%;
    max-width:260px;
    height:58px;
    font-size:21px;
    background:var(--orange);
    color:white;
    border:3px solid #E8842C;
    border-radius:18px;
    box-shadow:0 6px 0 #D87524;
}

#spinButton:active {
    box-shadow:0 3px 0 #D87524;
}

#spinButton:disabled {
    opacity:0.6;
    cursor:not-allowed;
}

#result {
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:900;
    text-align:center;
    font-size:20px;
    margin-top:12px;
    padding:12px;
    border-radius:15px;
    background:#FFF4DC;
    border:3px dashed var(--yellow);
    min-height:60px;
}

#result.celebrate {
    animation:resultPop 0.5s ease;
}

@keyframes resultPop {
    0% {transform:scale(0.8) rotate(-3deg);}
    60% {transform:scale(1.1) rotate(2deg);}
    100% {transform:scale(1) rotate(0);}
}

/* 質問一覧 */
.question-area h2 {
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:22px;
    text-align:center;
    margin:0 0 10px;
    background:#FFF4DC;
    border-radius:12px;
    padding:8px;
}

.question-subtitle {
    text-align:center;
    font-size:14px;
    color:#777;
    margin-bottom:12px;
}

#questionList {
    padding-left:28px;
    margin:0;
}

#questionList li {
    margin-bottom:8px;
    padding:7px;
    border-radius:8px;
    font-size:15px;
    line-height:1.6;
}

#questionList li.selected {
    background:#FFF0B8;
    font-weight:700;
    color:#C87900;
    border-left:5px solid var(--orange);
}

@media screen and (max-width:600px) {
    html,
    body {
        max-width:100%;
        overflow-x:hidden;
    }

    body {
        padding-left:12px;
        padding-right:12px;
    }

    .hero {
        padding-top:75px;
    }

    .main-container {
        flex-direction:column;
        align-items:center;
        width:100%;
        max-width:100%;
        gap:24px;
    }

    .roulette-area {
        width:100%;
        max-width:400px;
        flex:none;
        padding:15px;
    }

    .question-area {
        width:100%;
        max-width:400px;
        flex:none;
    }

    .roulette-container {
        width:100%;
        max-width:400px;
        height:auto;
        aspect-ratio:1/1;
        margin:0 auto;
    }

    #spinButton {
        max-width:100%;
        margin:16px auto;
    }

    button {
        max-width:100%;
        min-height:44px;
    }

    .mascot-message {
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="fixed-btn-left">
    <a href="area.html" class="back-btn">◀ もどる</a>
</div>

<div class="hero">

    <!-- 一番上の3枚のカード -->
    <div class="hero-cards">
        <div class="mini-card">🥫</div>
        <div class="mini-card">📄</div>
        <div class="mini-card">♻️</div>
    </div>

    <h1>Wakete！</h1>
    <h1>🎡 環境影響ルーレット 🎡</h1>

    <div class="mascot-area">
        <div class="mascot">🌎</div>
        <div class="mascot-message">
            ルーレットを回して<br>
            ミッションに挑戦しよう！✨
        </div>
    </div>

    <div class="main-container">

        <!-- 左側：ルーレット -->
        <div class="roulette-area">

            <div class="roulette-container">

                <div class="arrow" aria-hidden="true">
                    <div class="needle-circle">
                        <div class="needle-center"></div>
                    </div>
                </div>

                <canvas id="roulette" width="400" height="400"></canvas>

            </div>

            <button id="spinButton" onclick="startRoulette()">
                🎉 スタート！
            </button>

            <div id="result">🏆 ルーレットの結果：？</div>

        </div>

        <!-- 右側：質問一覧 -->
        <div class="question-area">

            <h2>📚 チャレンジ一覧</h2>
            <div class="question-subtitle">
                全8問から3問が選ばれるよ！
            </div>
            <ol id="questionList"></ol>

        </div>

    </div>
</div>

<script>

// 8種類の質問
const questions = [
    "ごみを減らすにはどうすればよい？",
    "家でよく出るごみは？",
    "そのゴミを　海、川、山、町、宇宙に分別せずに捨てたらどうなる？",
    "フードロスが減らせたらどんな良いことがある？",
    "ちゃんと分別するとどんな良いことがある？",
    "今日からできるごみを減らす工夫は？",
    "ちゃんと分別しないと世界はどうなる？",
    "危険物を普通ごみとして捨てるとどうなる？"
];

// 特別枠4種類
const specialItems = [
    "＋1枚",
    "＋2枚",
    "1枚奪い取る",
    "手札交換"
];

let selectedQuestions = [];
let isSpinning = false;
let angle = 0;

const canvas = document.getElementById("roulette");
const ctx = canvas.getContext("2d");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");
const questionList = document.getElementById("questionList");

// ルーレットの色
const colors = [
    "#ffcf8b",
    "#b9e4a5",
    "#a9d9f5",
    "#f5b5cf",
    "#c9b8f5",
    "#a8e6cf",
    "#ffd6a5"
];

// 特別枠の大きさは通常の半分
function getWeight(item) {
    return specialItems.includes(item) ? 0.5 : 1;
}

// 効果音
function playSound() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(550, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(
            900,
            audioContext.currentTime + 0.3
        );

        gain.gain.setValueAtTime(0.15, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.3
        );

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.3);
    } catch (e) {
        console.log("音を再生できませんでした");
    }
}

// 右側に8つの質問を表示
questions.forEach(question => {
    const li = document.createElement("li");
    li.textContent = question;
    questionList.appendChild(li);
});

// ルーレット描画
function drawRoulette() {

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 190;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (selectedQuestions.length === 0) {

        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#777777";
        ctx.lineWidth = 2;
        ctx.stroke();

        return;
    }

    const totalWeight = selectedQuestions.reduce(
        (sum, item) => sum + getWeight(item), 0
    );

    let passedWeight = 0;

    selectedQuestions.forEach((item, i) => {

        const weight = getWeight(item);
        const slice = Math.PI * 2 * weight / totalWeight;

        const start =
            angle +
            Math.PI * 2 * passedWeight / totalWeight -
            Math.PI / 2;

        const end = start + slice;

        passedWeight += weight;

        // 扇形を描く
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        // 文字の位置
        const mid = start + slice / 2;
        const textRadius = radius * 0.58;

        const tx = cx + Math.cos(mid) * textRadius;
        const ty = cy + Math.sin(mid) * textRadius;

        ctx.save();
        ctx.translate(tx, ty);

        let textAngle = mid + Math.PI / 2;

        if (Math.cos(mid) < 0) {
            textAngle += Math.PI;
        }

        ctx.rotate(textAngle);

        ctx.fillStyle = "#333333";
        ctx.font = weight === 0.5
            ? "bold 13px sans-serif"
            : "bold 14px sans-serif";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        let lines;

        if (item === "1枚奪い取る") {
            lines = ["1枚", "奪い取る"];
        } else if (item === "手札交換") {
            lines = ["手札交換"];
        } else {
            lines = [item];
        }

        // 通常質問は折り返す
        if (weight === 1) {
            lines = item.match(/.{1,8}/g) || [item];
        }

        const lineHeight = 17;

        lines.forEach((line, index) => {
            ctx.fillText(
                line,
                0,
                (index - (lines.length - 1) / 2) * lineHeight,
                weight === 0.5 ? 65 : 105
            );
        });

        ctx.restore();

    });

    // 中心の円
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#777777";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// ルーレット開始
function startRoulette() {

    if (isSpinning) return;

    // 8種類からランダムに3種類選ぶ
    selectedQuestions = [...questions]
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    // 特別枠4種類を追加
    selectedQuestions.push(...specialItems);

    // 7つの枠をランダムに配置
    selectedQuestions.sort(() => Math.random() - 0.5);

    // 選ばれた質問を右側で強調
    [...questionList.children].forEach(li => {
        li.classList.toggle(
            "selected",
            selectedQuestions.includes(li.textContent)
        );
    });

    drawRoulette();

    isSpinning = true;
    spinButton.disabled = true;
    spinButton.textContent = "🎡 回転中...";
    result.textContent = "🎡 回転中...";
    result.classList.remove("celebrate");

    // 枠の大きさに合わせて当選枠を決定
    const totalWeight = selectedQuestions.reduce(
        (sum, item) => sum + getWeight(item), 0
    );

    let randomWeight = Math.random() * totalWeight;
    let winnerIndex = 0;

    for (let i = 0; i < selectedQuestions.length; i++) {

        randomWeight -= getWeight(selectedQuestions[i]);

        if (randomWeight < 0) {
            winnerIndex = i;
            break;
        }
    }

    // 当選枠の前までの大きさ
    const beforeWinnerWeight = selectedQuestions
        .slice(0, winnerIndex)
        .reduce((sum, item) => sum + getWeight(item), 0);

    const winnerWeight = getWeight(selectedQuestions[winnerIndex]);

    // 当選枠の中心を12時に合わせる
    const targetAngle = -(
        (beforeWinnerWeight + winnerWeight / 2) / totalWeight
    ) * Math.PI * 2;

    const normalizedTarget =
        ((targetAngle % (Math.PI * 2)) + Math.PI * 2) %
        (Math.PI * 2);

    const normalizedCurrent =
        ((angle % (Math.PI * 2)) + Math.PI * 2) %
        (Math.PI * 2);

    const extraTurns = 6 * Math.PI * 2;

    const rotation =
        extraTurns +
        ((normalizedTarget - normalizedCurrent + Math.PI * 2) %
        (Math.PI * 2));

    const startAngle = angle;
    const endAngle = angle + rotation;

    const duration = 4500;
    const startTime = performance.now();

    function animate(now) {

        const progress = Math.min(
            (now - startTime) / duration,
            1
        );

        // 徐々に減速
        const eased = 1 - Math.pow(1 - progress, 4);

        angle = startAngle + rotation * eased;

        drawRoulette();

        if (progress < 1) {

            requestAnimationFrame(animate);

        } else {

            angle = endAngle;
            drawRoulette();

            const winner = selectedQuestions[winnerIndex];

            result.textContent = "🎉 結果：" + winner;

            result.classList.remove("celebrate");
            void result.offsetWidth;
            result.classList.add("celebrate");

            playSound();

            isSpinning = false;
            spinButton.disabled = false;
            spinButton.textContent = "🎉 スタート！";
        }
    }

    requestAnimationFrame(animate);
}

// 最初は空の円
drawRoulette();

</script>

</body>
</html>
