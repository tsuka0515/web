    --cream:#FFF9EE;
    --card:#FFFFFF;
    --ink:#33404A;
    --ink-soft:#6B7680;
    --green:#3FA65C;
    --green-bg:#E5F6E9;
    --yellow:#F5B93D;
    --yellow-bg:#FFF4DC;
    --red:#EF5B4E;
    --red-bg:#FDE6E3;
    --blue:#3E92CC;
    --blue-bg:#E4F1FA;
    --shadow: 0 6px 0 rgba(51,64,74,0.08), 0 10px 24px rgba(51,64,74,0.08);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 12%, var(--green-bg) 0%, transparent 40%),
      radial-gradient(circle at 92% 18%, var(--red-bg) 0%, transparent 38%),
      radial-gradient(circle at 50% 90%, var(--yellow-bg) 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    font-family:'BIZ UDPGothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    font-size:18px;
    line-height:1.9;
    padding-bottom:80px;
  }
  ruby rt{
    font-size:0.55em;
    color:var(--ink-soft);
    font-weight:400;
    letter-spacing:0;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 20px;
  }

  /* HERO */
  .hero{
    text-align:center;
    padding:56px 20px 40px;
    position:relative;
  }
  .hero-cards{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:18px;
  }
  .mini-card{
    width:52px; height:70px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    box-shadow: var(--shadow);
    transform: rotate(var(--r, 0deg));
    background:var(--card);
    border:3px solid var(--c, var(--ink));
  }
  .mini-card:nth-child(1){ --r:-10deg; --c:var(--green); }
  .mini-card:nth-child(2){ --r:4deg; --c:var(--yellow); margin-top:-8px;}
  .mini-card:nth-child(3){ --r:12deg; --c:var(--red); }

  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 7vw, 44px);
    margin:0 0 8px;
    color:var(--ink);
    letter-spacing:0.02em;
  }
  .subtitle{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    color:var(--ink-soft);
    font-size:17px;
    margin:0;
    letter-spacing:0.1em;
  }

  /* CARD (base block) */
  .card{
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:26px 24px;
    margin:22px 0;
  }
  .card h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .objective p{ margin:0; }

  /* TABS */
  .tabs{
    display:flex;
    gap:12px;
    max-width:760px;
    margin:30px auto 0;
    padding:0 20px;
  }
  .tab-btn{
    flex:1;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    padding:16px 10px;
    border-radius:18px 18px 0 0;
    border:none;
    cursor:pointer;
    color:var(--card);
    opacity:0.55;
    transition:opacity 0.2s ease, transform 0.15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .tab-btn:hover{ opacity:0.8; }
  .tab-btn.active{ opacity:1; }
  .tab-btn:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  #easy-btn{ background:var(--green); }
  #hard-btn{ background:var(--red); }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .section-band{
    border-radius:0 0 22px 22px;
    padding:4px;
  }
  .section-band.easy{ background:var(--green); }
  .section-band.hard{ background:var(--red); }
  .section-inner{
    background:var(--cream);
    border-radius:0 0 20px 20px;
    padding:20px 4px 4px;
  }

  /* Step list */
  ol.steps{
    list-style:none;
    margin:0;
    padding:0;
    counter-reset:step;
  }
  ol.steps li{
    counter-increment:step;
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }
  ol.steps li:last-child{ margin-bottom:0; }
  ol.steps li::before{
    content:counter(step);
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--accent, var(--blue));
    color:#fff;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }
  .easy-card ol.steps li::before{ --accent: var(--green); }
  .hard-card ol.steps li::before{ --accent: var(--red); }
  ol.steps li p{ margin:4px 0 0; }

  .result-box{
    background:var(--yellow-bg);
    border:2px dashed var(--yellow);
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    gap:12px;
    align-items:center;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .result-box .icon{ font-size:26px; flex:none; }

  /* Traffic light score table (signature element) */
  .score-panel{
    display:flex;
    gap:18px;
    align-items:center;
    flex-wrap:wrap;
    margin:10px 0 18px;
  }
  .light-box{
    background:#2E3540;
    border-radius:20px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:var(--shadow);
    flex:none;
  }
  .light{
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:15px;
    color:#fff;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), 0 0 14px var(--glow);
  }
  .light.g{ background:var(--green); --glow: rgba(63,166,92,0.7); }
  .light.y{ background:var(--yellow); --glow: rgba(245,185,61,0.7); color:#5a4300;}
  .light.r{ background:var(--red); --glow: rgba(239,91,78,0.7); }

  .score-legend{
    flex:1;
    min-width:220px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
  }
  .score-row .dot{
    width:16px; height:16px; border-radius:50%; flex:none;
  }
  .score-row .dot.g{ background:var(--green); }
  .score-row .dot.y{ background:var(--yellow); }
  .score-row .dot.r{ background:var(--red); }

  .note{
    color:var(--ink-soft);
    font-size:15px;
    margin-top:14px;
  }

  ruby{ font-feature-settings:"ruby" 1; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }

  @media (max-width:480px){

    <h1>🎡 環境影響ルーレット</h1>

    <div class="main-container">

    <!-- 左側：ルーレット -->
    <div class="roulette-area">
    <div class="roulette-container">

       
<!-- ルーレット内側の固定針 -->
<div class="arrow" aria-hidden="true">
    <div class="needle-circle">
        <div class="needle-center"></div>
    </div>
</div>


        <canvas id="roulette" width="400" height="400"></canvas>
    </div>

    <button id="spinButton" onclick="startRoulette()">
        スタート！
    </button>

    <div id="result">結果：？</div>
</div>

<!-- 右側：質問一覧 -->
<div class="question-area">
    <h2>質問一覧（全8問）</h2>
    <ol id="questionList"></ol>
</div>

</div>


    
<script>
const questions = [
    "a",
    "好きなゲームは？",
    "行ってみたい場所は？",
    "好きな季節は？",
    "最近楽しかったことは？",
    "好きなキャラクターは？",
    "挑戦してみたいことは？",
    "休日は何をしている？"
];

let selectedQuestions = [];
let isSpinning = false;
let angle = 0;

const canvas = document.getElementById("roulette");
const ctx = canvas.getContext("2d");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");
const questionList = document.getElementById("questionList");

const colors = ["#ffcf8b", "#b9e4a5", "#a9d9f5"];

// 右側に8つの質問を表示
questions.forEach(question => {
    const li = document.createElement("li");
    li.textContent = question;
    questionList.appendChild(li);
});

// ルーレットを描画
function drawRoulette() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 190;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (selectedQuestions.length === 0) {
// 中心の円 〇
ctx.beginPath();
ctx.arc(cx, cy, 8, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();
ctx.strokeStyle = "#777777";
ctx.lineWidth = 2;
ctx.stroke();

        ctx.fillStyle = "#444444";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("スタート！", cx, cy);
        return;
    }

    const slice = (Math.PI * 2) / selectedQuestions.length;

    selectedQuestions.forEach((question, i) => {
        const start = angle + i * slice - Math.PI / 2;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        // 質問の文字を扇形の中に表示
        const mid = start + slice / 2;
        const textRadius = radius * 0.58;
        const tx = cx + Math.cos(mid) * textRadius;
        const ty = cy + Math.sin(mid) * textRadius;

        ctx.save();
        ctx.translate(tx, ty);

        let textAngle = mid + Math.PI / 2;
        if (Math.cos(mid) < 0) {
            textAngle += Math.PI;
        }
        ctx.rotate(textAngle);

        ctx.fillStyle = "#333333";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // 長い質問は折り返して表示
        const maxWidth = 105;
        const words = question.match(/.{1,8}/g) || [question];
        words.forEach((line, lineIndex) => {
            ctx.fillText(
                line,
                0,
                (lineIndex - (words.length - 1) / 2) * 18,
                maxWidth
            );
        });

        ctx.restore();
    });

    // 中心の円
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#777777";
    ctx.stroke();
}

// スタートボタンで3問を選んで回転
function startRoulette() {
    if (isSpinning) return;

    // 毎回8問からランダムに3問選択
    selectedQuestions = [...questions]
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    // 右側の一覧で選ばれた質問を強調
    [...questionList.children].forEach(li => {
        li.classList.toggle(
            "selected",
            selectedQuestions.includes(li.textContent)
        );
    });

    drawRoulette();

    isSpinning = true;
    spinButton.disabled = true;
    result.textContent = "回転中...";

    // ランダムに当選する質問を決める
    const winnerIndex = Math.floor(
        Math.random() * selectedQuestions.length
    );

    const slice = (Math.PI * 2) / selectedQuestions.length;

    // 描画時の扇形中心は angle + (winnerIndex + 0.5) * slice - π/2。
    // 固定矢印の方向（12時＝-π/2）に合わせるため、開始位置の補正は相殺する。
    const targetAngle = -(winnerIndex + 0.5) * slice;

    // 現在角度から、何周かした後に当たりの角度で止める
    const normalizedTarget =
        ((targetAngle % (Math.PI * 2)) + Math.PI * 2) %
        (Math.PI * 2);

    const normalizedCurrent =
        ((angle % (Math.PI * 2)) + Math.PI * 2) %
        (Math.PI * 2);

    const extraTurns = 6 * Math.PI * 2;
    const rotation =
        extraTurns +
        ((normalizedTarget - normalizedCurrent + Math.PI * 2) %
        (Math.PI * 2));

    const startAngle = angle;
    const endAngle = angle + rotation;
    const duration = 4000;
    const startTime = performance.now();

    function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);

        // 徐々に減速する
        const eased = 1 - Math.pow(1 - progress, 4);
        angle = startAngle + rotation * eased;

        drawRoulette();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            angle = endAngle;
            drawRoulette();

            result.textContent =
                "結果：" + selectedQuestions[winnerIndex];

            isSpinning = false;
            spinButton.disabled = false;
        }
    }

    requestAnimationFrame(animate);
}

// 最初は灰色の円を表示
drawRoulette();
</script>

</body>
